<!DOCTYPE html>
<!-- 1. Hook: Make videos with code?  (6 s). Shared styles + helpers live in index.html and assets/motion.js. -->
<html lang="en" data-composition-variables="[{&quot;id&quot;:&quot;headline&quot;,&quot;type&quot;:&quot;string&quot;,&quot;label&quot;:&quot;Headline&quot;,&quot;default&quot;:&quot;Make videos&quot;}]">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="hook-template">
      <style>
        #hook {
          position: absolute;
          inset: 0;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 90px 120px;
          background: var(--violet);
          color: #fff;
        }
      </style>

      <div data-hf-id="hf-ihq5" id="hook" data-composition-id="hook" data-width="1920" data-height="1080" data-duration="6">
        <div data-hf-id="hf-4zbb" class="layer" id="hook-shapes">
          <span data-hf-id="hf-137e" class="shape s-circle" id="hook-shape-1" data-rot="0" style="left: 12%; top: 22%; width: 150px; height: 150px; margin: -75px 0 0 -75px; font-size: 150px; color: var(--pink)"><i id="hook-shape-1-fill" data-hf-id="hf-wt6k"></i></span>
          <span data-hf-id="hf-4pwi" class="shape s-ring" id="hook-shape-2" data-rot="0" style="left: 86%; top: 20%; width: 170px; height: 170px; margin: -85px 0 0 -85px; font-size: 170px; color: var(--yellow)"><i id="hook-shape-2-fill" data-hf-id="hf-zeb8"></i></span>
          <span data-hf-id="hf-eton" class="shape s-tri" id="hook-shape-3" data-rot="15" style="left: 88%; top: 78%; width: 150px; height: 150px; margin: -75px 0 0 -75px; font-size: 150px; color: var(--mint)"><i id="hook-shape-3-fill" data-hf-id="hf-y7e5"></i></span>
          <span data-hf-id="hf-vqmc" class="shape s-plus" id="hook-shape-4" data-rot="10" style="left: 10%; top: 78%; width: 120px; height: 120px; margin: -60px 0 0 -60px; font-size: 120px; color: var(--yellow)"><i id="hook-shape-4-fill" data-hf-id="hf-ylp6"></i></span>
          <span data-hf-id="hf-x16g" class="shape s-dots" id="hook-shape-5" data-rot="0" style="left: 76%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px; font-size: 140px; color: var(--cream)"><i id="hook-shape-5-fill" data-hf-id="hf-0l8b"></i></span>
          <span data-hf-id="hf-fhxq" class="shape s-zig" id="hook-shape-6" data-rot="-10" style="left: 8%; top: 52%; width: 160px; height: 160px; margin: -80px 0 0 -80px; font-size: 160px; color: var(--mint)"><i id="hook-shape-6-fill" data-hf-id="hf-0zjc"></i></span>
          <span data-hf-id="hf-y04k" class="shape s-square" id="hook-shape-7" data-rot="20" style="left: 55%; top: 12%; width: 70px; height: 70px; margin: -35px 0 0 -35px; font-size: 70px; color: var(--orange)"><i id="hook-shape-7-fill" data-hf-id="hf-zsm9"></i></span>
          <span data-hf-id="hf-wwmd" class="shape s-circle" id="hook-shape-8" data-rot="0" style="left: 45%; top: 88%; width: 60px; height: 60px; margin: -30px 0 0 -30px; font-size: 60px; color: var(--yellow)"><i id="hook-shape-8-fill" data-hf-id="hf-06xa"></i></span>
        </div>
        <div data-hf-id="hf-wc8c" class="content" id="hook-content">
          <div data-hf-id="hf-cb7b" class="mega" id="hook-l1"><span data-hf-id="hf-36kl" class="wm"><span data-hf-id="hf-rs7s" class="w" id="hook-l1-w1">Make</span></span><span data-hf-id="hf-w1g9" class="wm"><span data-hf-id="hf-anfd" class="w" id="hook-l1-w2">videos</span></span></div>
          <div data-hf-id="hf-3wha" class="mega" id="hook-l2" style="margin-top: 26px"><span data-hf-id="hf-x8dc" class="wm"><span data-hf-id="hf-n7un" class="w" id="hook-l2-w1">with</span></span><span data-hf-id="hf-wu2b" class="wm"><span id="hook-l2-w2" data-hf-id="hf-7y8a" class="pill w">code?</span></span></div>
          <div data-hf-id="hf-ucqj" class="lead" id="hook-sub" style="margin-top: 50px"><span data-hf-id="hf-uuj6" class="wm"><span data-hf-id="hf-jtyc" class="w" id="hook-sub-w1">No</span></span><span data-hf-id="hf-ug85" class="wm"><span data-hf-id="hf-8xwn" class="w" id="hook-sub-w2">camera.</span></span><span data-hf-id="hf-vn58" class="wm"><span data-hf-id="hf-9dyq" class="w" id="hook-sub-w3">No</span></span><span data-hf-id="hf-v8u7" class="wm"><span data-hf-id="hf-ukqy" class="w" id="hook-sub-w4">editing</span></span><span data-hf-id="hf-t9b2" class="wm"><span data-hf-id="hf-x5w0" class="w" id="hook-sub-w5">app.</span></span><span data-hf-id="hf-sv01" class="wm"><span data-hf-id="hf-6vye" class="w" id="hook-sub-w6">Just</span></span><span data-hf-id="hf-4pcb" class="wm"><span data-hf-id="hf-4ve7" class="w" id="hook-sub-w7">Claude.</span></span></div>
        </div>
        <!-- colored wipes into / out of this scene -->
        <div data-hf-id="hf-zrx2" class="wipe" data-layout-allow-overflow="" id="hook-wipe-out"><b data-hf-id="hf-empr" class="p" id="hook-wipe-out-a" style="background: var(--yellow)"></b><b data-hf-id="hf-ldrg" class="p" id="hook-wipe-out-b" style="background: var(--pink)"></b></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("hook", 6); // scene length (set in index.html)
          // Headline variable (Variables tab in Studio)
          const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          HF.setWords(HF.$("#hook-l1"), vars.headline);
          HF.splitWords(document.getElementById("hook"));

          const t = 0; // times below are seconds from the start of this scene
          const sh = HF.$$("#hook-shapes .shape"); // the shapes are in the HTML above
          HF.animateShapes(tl, sh, t + 0.1, D);
          HF.popWords(tl, "#hook-l1", t + 0.15, { stagger: 0.12, d: 0.6 });
          HF.popWords(tl, "#hook-l2", t + 0.75, { stagger: 0.14, d: 0.6 });
          tl.fromTo("#hook-l2 .pill", { rotation: 0, scale: 1 }, { rotation: -4, scale: 1.08, duration: 0.3, ease: "back.out(3)" }, t + 1.7);
          HF.popWords(tl, "#hook-sub", t + 2.0, { stagger: 0.07, d: 0.45 });
          // tension build into the drop at 6 s
          tl.fromTo("#hook-content", { scale: 1 }, { scale: 1.12, duration: 2, ease: "power2.in" }, D - 2);
          HF.wipes(tl, D, null, HF.$("#hook-wipe-out"));
          window.__timelines["hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
