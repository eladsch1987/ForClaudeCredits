<!DOCTYPE html>
<!-- 4. How it works  (10 s). Shared styles + helpers live in index.html and assets/motion.js. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="how-template">
      <style>
        #how {
          position: absolute;
          inset: 0;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 90px 120px;
          background: var(--mint);
          color: var(--ink);
        }
        /* ---------- scene 4: how it works ---------- */
        .steps {
          position: relative;
          display: flex;
          gap: 40px;
          margin-top: 80px;
        }
        .step-line {
          position: absolute;
          left: 200px;
          right: 200px;
          top: 76px;
          height: 12px;
          border-radius: 6px;
          background: rgba(27, 16, 54, 0.2);
          overflow: hidden;
        }
        .step-line b {
          display: block;
          width: 100%;
          height: 100%;
          background: var(--ink);
          transform-origin: left center;
        }
        .step {
          position: relative;
          width: 380px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
        .step-icon {
          width: 164px;
          height: 164px;
          border-radius: 50%;
          background: var(--cream);
          border: 7px solid var(--ink);
          display: flex;
          align-items: center;
          justify-content: center;
          position: relative;
        }
        .step-icon svg {
          width: 84px;
          height: 84px;
          display: block;
        }
        .step-num {
          position: absolute;
          right: -10px;
          top: -10px;
          width: 58px;
          height: 58px;
          border-radius: 50%;
          background: var(--pink);
          color: #fff;
          font-weight: 900;
          font-size: 32px;
          display: flex;
          align-items: center;
          justify-content: center;
          border: 5px solid var(--ink);
        }
        .step h3 {
          white-space: nowrap;
          font-weight: 900;
          font-size: 46px;
          margin-top: 30px;
          letter-spacing: -0.02em;
        }
        .step p {
          font-weight: 600;
          font-size: 30px;
          line-height: 1.3;
          margin-top: 10px;
          max-width: 340px;
        }
        .ready {
          margin-top: 70px;
          background: var(--ink);
          color: var(--yellow);
          font-weight: 900;
          font-size: 46px;
          padding: 16px 44px;
          border-radius: 999px;
        }
      </style>

      <div data-hf-id="hf-zf2g" id="how" data-composition-id="how" data-width="1920" data-height="1080" data-duration="10">
        <div data-hf-id="hf-z4iw" class="layer" id="how-shapes"></div>
        <div data-hf-id="hf-mcm7" class="content">
          <div data-hf-id="hf-ewca" class="title split" id="how-title">How it works</div>
          <div data-hf-id="hf-70xd" class="steps">
            <div data-hf-id="hf-n0vx" class="step-line"><b data-hf-id="hf-o8sv" id="how-line"></b></div>
            <div data-hf-id="hf-1kgw" class="step" id="step-1">
              <div data-hf-id="hf-k2mg" class="step-icon">
                <svg data-hf-id="hf-79jd" viewBox="0 0 84 84">
                  <path data-hf-id="hf-163r" d="M10 14h64a6 6 0 0 1 6 6v36a6 6 0 0 1-6 6H34L18 76V62h-8a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6z" fill="#5B2EFF" />
                  <circle data-hf-id="hf-63zb" cx="26" cy="38" r="5" fill="#fff" />
                  <circle data-hf-id="hf-sye5" cx="42" cy="38" r="5" fill="#fff" />
                  <circle data-hf-id="hf-xulw" cx="58" cy="38" r="5" fill="#fff" />
                </svg>
                <div data-hf-id="hf-ch3k" class="step-num">1</div>
              </div>
              <h3 data-hf-id="hf-1342">Describe it</h3>
              <p data-hf-id="hf-74dq">Tell Claude your idea in plain words</p>
            </div>
            <div data-hf-id="hf-cfyj" class="step" id="step-2">
              <div data-hf-id="hf-22m8" class="step-icon">
                <svg data-hf-id="hf-uxh9" viewBox="0 0 84 84">
                  <path data-hf-id="hf-pufj" d="M30 20 8 42l22 22M54 20l22 22-22 22" stroke="#FF2E7E" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div data-hf-id="hf-ba6h" class="step-num">2</div>
              </div>
              <h3 data-hf-id="hf-886k">Claude builds it</h3>
              <p data-hf-id="hf-lclv">Scenes, text, motion &amp; music, as code</p>
            </div>
            <div data-hf-id="hf-8hui" class="step" id="step-3">
              <div data-hf-id="hf-0vp5" class="step-icon">
                <svg data-hf-id="hf-w4ec" viewBox="0 0 84 84">
                  <rect data-hf-id="hf-6f70" x="6" y="14" width="72" height="54" rx="8" fill="#1B1036" />
                  <path data-hf-id="hf-khz6" d="M34 28v26l22-13z" fill="#2EE6C5" />
                </svg>
                <div data-hf-id="hf-bohi" class="step-num">3</div>
              </div>
              <h3 data-hf-id="hf-eobx">Preview it</h3>
              <p data-hf-id="hf-ajdx">Watch it live in your browser</p>
            </div>
            <div data-hf-id="hf-pq4t" class="step" id="step-4">
              <div data-hf-id="hf-1a06" class="step-icon">
                <svg data-hf-id="hf-vq3b" viewBox="0 0 84 84">
                  <path data-hf-id="hf-jhcb" d="M42 8v44M24 36l18 18 18-18" stroke="#FF7A1A" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                  <rect data-hf-id="hf-0gkv" x="10" y="62" width="64" height="12" rx="6" fill="#1B1036" />
                </svg>
                <div data-hf-id="hf-ahkf" class="step-num">4</div>
              </div>
              <h3 data-hf-id="hf-s0lt">Render it</h3>
              <p data-hf-id="hf-0ur8">Export a real MP4 video file</p>
            </div>
          </div>
          <div data-hf-id="hf-pc28" class="ready" id="how-ready">Ready to post!</div>
        </div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("how", 10); // scene length (set in index.html)
          HF.splitWords(document.getElementById("how"));

          const t = 0; // times below are seconds from the start of this scene
          const sh = HF.shapes(document.getElementById("how-shapes"), [
            ["plus", 6, 14, 110, "var(--cream)", 0],
            ["circle", 94, 16, 130, "var(--yellow)", 0],
            ["dots", 92, 88, 150, "var(--ink)", 0],
            ["tri", 7, 86, 120, "var(--violet)", 0],
          ]);
          HF.animateShapes(tl, sh, t + 0.2, D);
          HF.popWords(tl, "#how-title", t + 0.2);
          const stepT = [0.8, 2.4, 4.4, 6.4]; // one step every bar, after the title
          stepT.forEach((st, k) => {
            const id = `#step-${k + 1}`;
            tl.fromTo(`${id} .step-icon`, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, t + st);
            tl.fromTo(`${id} h3`, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t + st + 0.2);
            tl.fromTo(`${id} p`, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, t + st + 0.35);
            tl.fromTo(`${id} .step-num`, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, t + st + 0.4);
          });
          tl.fromTo("#how-line", { scaleX: 0 }, { scaleX: 1, duration: 5.8, ease: "none" }, t + 0.9);
          tl.fromTo("#how-ready", { scale: 0, rotation: -8 }, { scale: 1, rotation: -3, duration: 0.6, ease: "back.out(2.5)" }, t + 8.0);
          HF.wipes(tl, document.getElementById("how"), D, ["var(--pink)", "var(--mint)"], ["var(--yellow)", "var(--ink)"]);
          window.__timelines["how"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
