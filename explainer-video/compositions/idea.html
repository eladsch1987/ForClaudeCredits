<!DOCTYPE html>
<!-- 2. The trick: a video is a web page that moves  (8 s). Shared styles + helpers live in index.html and assets/motion.js. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="idea-template">
      <style>
        #idea {
          position: absolute;
          inset: 0;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 90px 120px;
          background: var(--pink);
          color: #fff;
        }
        /* ---------- scene 2: code -> video ---------- */
        .idea-row {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 56px;
          margin-top: 54px;
        }
        .code-card {
          width: 700px;
          height: 380px;
          border-radius: 32px;
          background: var(--ink);
          padding: 34px 40px;
          text-align: left;
          box-shadow: 0 24px 0 rgba(0, 0, 0, 0.18);
        }
        .dots3 {
          display: flex;
          gap: 12px;
          margin-bottom: 30px;
        }
        .dots3 i {
          display: block;
          width: 22px;
          height: 22px;
          border-radius: 50%;
        }
        .code-line {
          font-size: 36px;
          line-height: 1.7;
          white-space: nowrap;
          overflow: hidden;
          width: 0;
          color: var(--cream);
        }
        .tok-tag {
          color: var(--pink);
        }
        .tok-fn {
          color: var(--mint);
        }
        .tok-str {
          color: var(--yellow);
        }
        .arrow {
          width: 150px;
          height: 34px;
          display: block;
          position: relative;
        }
        .arrow b {
          position: absolute;
          left: 0;
          top: 11px;
          width: 120px;
          height: 12px;
          border-radius: 6px;
          background: var(--cream);
          transform-origin: left center;
          display: block;
        }
        .arrow em {
          position: absolute;
          right: 0;
          top: 0;
          width: 40px;
          height: 34px;
          background: var(--cream);
          clip-path: polygon(0 0, 100% 50%, 0 100%);
          display: block;
        }
        .video-card {
          width: 640px;
          height: 380px;
          border-radius: 32px;
          background: var(--cream);
          color: var(--ink);
          position: relative;
          overflow: hidden;
          box-shadow: 0 24px 0 rgba(0, 0, 0, 0.18);
        }
        .video-screen {
          position: absolute;
          left: 24px;
          right: 24px;
          top: 24px;
          bottom: 74px;
          border-radius: 18px;
          background: var(--violet);
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
        }
        .video-hello {
          display: block;
          color: #fff;
          font-weight: 900;
          font-size: 80px;
          letter-spacing: -0.03em;
        }
        .video-bar {
          position: absolute;
          left: 92px;
          right: 34px;
          bottom: 32px;
          height: 14px;
          border-radius: 7px;
          background: rgba(27, 16, 54, 0.18);
          overflow: hidden;
        }
        .video-bar b {
          display: block;
          width: 100%;
          height: 100%;
          background: var(--pink);
          transform-origin: left center;
        }
        .video-play {
          position: absolute;
          left: 34px;
          bottom: 25px;
          width: 30px;
          height: 30px;
          background: var(--ink);
          clip-path: polygon(10% 0, 100% 50%, 10% 100%);
        }
      </style>

      <div data-hf-id="hf-di8b" id="idea" data-composition-id="idea" data-width="1920" data-height="1080" data-duration="8">
        <div data-hf-id="hf-h6g3" class="layer" id="idea-shapes">
          <span data-hf-id="hf-qs6v" class="shape s-ring" id="idea-shape-1" data-rot="0" style="left: 5%; top: 52%; width: 130px; height: 130px; margin: -65px 0 0 -65px; font-size: 130px; color: var(--yellow)"><i id="idea-shape-1-fill" data-hf-id="hf-wt6k"></i></span>
          <span data-hf-id="hf-ulsq" class="shape s-circle" id="idea-shape-2" data-rot="0" style="left: 95%; top: 86%; width: 160px; height: 160px; margin: -80px 0 0 -80px; font-size: 160px; color: var(--violet)"><i id="idea-shape-2-fill" data-hf-id="hf-zeb8"></i></span>
          <span data-hf-id="hf-ir1i" class="shape s-plus" id="idea-shape-3" data-rot="0" style="left: 94%; top: 14%; width: 100px; height: 100px; margin: -50px 0 0 -50px; font-size: 100px; color: var(--cream)"><i id="idea-shape-3-fill" data-hf-id="hf-y7e5"></i></span>
          <span data-hf-id="hf-g8ll" class="shape s-dots" id="idea-shape-4" data-rot="0" style="left: 4%; top: 84%; width: 140px; height: 140px; margin: -70px 0 0 -70px; font-size: 140px; color: var(--yellow)"><i id="idea-shape-4-fill" data-hf-id="hf-ylp6"></i></span>
        </div>
        <div id="idea-content" data-hf-id="hf-mcm7" class="content">
          <div data-hf-id="hf-8koh" class="title" id="idea-title"><span data-hf-id="hf-36kl" class="wm"><span data-hf-id="hf-sh7q" class="w" id="idea-title-w1">The</span></span><span data-hf-id="hf-w1g9" class="wm"><span data-hf-id="hf-aozr" class="w" id="idea-title-w2">trick:</span></span><span data-hf-id="hf-x8dc" class="wm"><span data-hf-id="hf-46bk" class="w" id="idea-title-w3">a</span></span><span data-hf-id="hf-wu2b" class="wm"><span data-hf-id="hf-mdet" class="w" id="idea-title-w4">video</span></span><span data-hf-id="hf-uuj6" class="wm"><span data-hf-id="hf-xvcr" class="w" id="idea-title-w5">is</span></span><span data-hf-id="hf-ug85" class="wm"><span data-hf-id="hf-twrr" class="w" id="idea-title-w6">a</span></span><span data-hf-id="hf-vn58" class="wm"><span data-hf-id="hf-zq35" class="w" id="idea-title-w7">web</span></span><span data-hf-id="hf-v8u7" class="wm"><span data-hf-id="hf-622p" class="w" id="idea-title-w8">page</span></span><span data-hf-id="hf-t9b2" class="wm"><span data-hf-id="hf-5lbe" class="w" id="idea-title-w9">that</span></span><span data-hf-id="hf-sv01" class="wm"><span data-hf-id="hf-non9" class="w" id="idea-title-w10">moves.</span></span></div>
          <div id="idea-idea-row" data-hf-id="hf-nghm" class="idea-row">
            <div data-hf-id="hf-gabp" class="code-card" id="idea-code">
              <div id="idea-dots3" data-hf-id="hf-efdb" class="dots3"><i id="idea-i" data-hf-id="hf-zdr9" style="background: var(--pink)"></i><i id="idea-i-2" data-hf-id="hf-7oyx" style="background: var(--yellow)"></i><i id="idea-i-3" data-hf-id="hf-n8zd" style="background: var(--mint)"></i></div>
              <div id="idea-code-line" data-hf-id="hf-hqxs" class="code-line mono"><span id="idea-h1" data-hf-id="hf-60yd" class="tok-tag">&lt;h1&gt;</span>Hello!<span id="idea-h1-2" data-hf-id="hf-2xmi" class="tok-tag">&lt;/h1&gt;</span></div>
              <div id="idea-code-line-2" data-hf-id="hf-qwm3" class="code-line mono"><span id="idea-gsap" data-hf-id="hf-3lbp" class="tok-fn">gsap</span>.to(<span id="idea-h1-3" data-hf-id="hf-l2ru" class="tok-str">"h1"</span>, {</div>
              <div id="idea-scale" data-hf-id="hf-o694" class="code-line mono">&#160;&#160;scale: <span id="idea-1-6" data-hf-id="hf-5b6e" class="tok-str">1.6</span>, rotate: <span id="idea-8" data-hf-id="hf-fiuq" class="tok-str">-8</span></div>
              <div id="idea-code-line-3" data-hf-id="hf-gvw6" class="code-line mono">});</div>
            </div>
            <div data-hf-id="hf-j8n4" class="arrow" id="idea-arrow"><b id="idea-b" data-hf-id="hf-xujp"></b><em id="idea-em" data-hf-id="hf-2lav"></em></div>
            <div data-hf-id="hf-r4z5" class="video-card" id="idea-video">
              <div id="idea-video-screen" data-hf-id="hf-wovu" class="video-screen"><span data-hf-id="hf-kmri" class="video-hello" id="idea-hello">Hello!</span></div>
              <div id="idea-video-play" data-hf-id="hf-bes4" class="video-play"></div>
              <div id="idea-video-bar" data-hf-id="hf-taz5" class="video-bar"><b data-hf-id="hf-qtxn" id="idea-bar"></b></div>
            </div>
          </div>
          <div data-hf-id="hf-12y9" class="chip small" id="idea-cap" style="margin-top: 54px">Claude writes the code &#160;→&#160; a free renderer records it as an MP4</div>
        </div>
        <!-- colored wipes into / out of this scene -->
        <div data-hf-id="hf-kv3v" class="wipe" data-layout-allow-overflow="" id="idea-wipe-in"><b data-hf-id="hf-dz28" class="p" id="idea-wipe-in-a" style="background: var(--yellow)"></b><b data-hf-id="hf-2ofv" class="p" id="idea-wipe-in-b" style="background: var(--pink)"></b></div>
        <div data-hf-id="hf-qsc6" class="wipe" data-layout-allow-overflow="" id="idea-wipe-out"><b data-hf-id="hf-l6lo" class="p" id="idea-wipe-out-a" style="background: var(--violet)"></b><b data-hf-id="hf-hcz0" class="p" id="idea-wipe-out-b" style="background: var(--yellow)"></b></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("idea", 8); // scene length (set in index.html)
          HF.splitWords(document.getElementById("idea"));

          const t = 0; // times below are seconds from the start of this scene
          const sh = HF.$$("#idea-shapes .shape"); // the shapes are in the HTML above
          HF.animateShapes(tl, sh, t + 0.2, D);
          HF.popWords(tl, "#idea-title", t + 0.25, { stagger: 0.07 });
          tl.fromTo("#idea-code", { x: -300, opacity: 0, rotation: -6 }, { x: 0, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.6)" }, t + 1.2);
          HF.$$("#idea-code .code-line").forEach((line, k) => {
            tl.fromTo(line, { width: 0 }, { width: 640, duration: 0.45, ease: "steps(18)" }, t + 1.7 + k * 0.45);
          });
          tl.fromTo("#idea-arrow b", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, t + 3.6);
          tl.fromTo("#idea-arrow em", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, t + 3.8);
          tl.fromTo(
            "#idea-video",
            { scale: 0.3, opacity: 0, rotation: 8 },
            { scale: 1, opacity: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" },
            t + 4.0,
          );
          tl.fromTo("#idea-hello", { scale: 1, rotation: 0 }, { scale: 1.6, rotation: -8, duration: 0.8, ease: "elastic.out(1, 0.45)" }, t + 4.6);
          tl.fromTo("#idea-bar", { scaleX: 0 }, { scaleX: 1, duration: 3.4, ease: "none" }, t + 4.4);
          HF.pop(tl, "#idea-cap", t + 5.0);
          HF.wipes(tl, D, HF.$("#idea-wipe-in"), HF.$("#idea-wipe-out"));
          window.__timelines["idea"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
