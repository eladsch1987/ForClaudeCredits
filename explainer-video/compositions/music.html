      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("music", 8); // scene length (set in index.html)
          HF.splitWords(document.getElementById("music"));

          const t = 0; // times below are seconds from the start of this scene
          const d = D;
          HF.popWords(tl, "#music-title", t + 0.15);
          tl.fromTo("#music-sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t + 0.9);
          // a layer lights up every bar, exactly when it joins the music
          [1, 2, 3, 4].forEach((n, k) => {
            const on = t + k * 2; // 32, 34, 36, 38 s
            const id = `#ml-${n}`;
            tl.fromTo(id, { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, t + 0.3 + k * 0.12);
            tl.fromTo(`${id} .fill`, { opacity: 0 }, { opacity: 1, duration: 0.15 }, on);
            tl.fromTo(id, { scale: 1 }, { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, on);
            HF.$$(`${id} .eq b`).forEach((bar, j) => {
              const beats = Math.floor((t + d - on) / HF.BEAT);
              tl.fromTo(
                bar,
                { scaleY: 0.3 },
                { scaleY: 0.55 + (0.45 * ((j * 37 + n * 11) % 10)) / 10, duration: HF.BEAT / 2, ease: "power2.out", yoyo: true, repeat: beats * 2 - 1 },
                on,
              );
            });
          });
          // big equalizer along the bottom, pumping on every beat
          HF.$$("#music-eq b").forEach((b, k) => {
            const h = 0.25 + 0.75 * Math.abs(Math.sin(k * 0.7));
            tl.fromTo(b, { scaleY: 0.3 * h }, { scaleY: h, duration: HF.BEAT / 2, ease: "power3.out", yoyo: true, repeat: Math.floor(d / HF.BEAT) * 2 - 1 }, t);
          });
          HF.wipes(tl, D, HF.$("#music-wipe-in"), HF.$("#music-wipe-out"));
          window.__timelines["music"] = tl;
        })();
      </script>
