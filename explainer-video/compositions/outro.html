      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("outro", 4); // scene length (set in index.html)
          const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          HF.setWords(HF.$("#outro-l1"), vars.cta);
          const rnd = HF.rng(42);
          HF.splitWords(document.getElementById("outro"));

          const t = 0; // times below are seconds from the start of this scene
          // confetti pieces are in the HTML above; each gets a seeded random burst
          HF.$$("#outro-confetti .confetti").forEach((p) => {
            rnd();
            rnd(); // (these two draws used to pick each piece's size, now written in the HTML)
            const ang = rnd() * Math.PI * 2;
            const dist = 400 + rnd() * 700;
            tl.fromTo(
              p,
              { x: 0, y: 0, rotation: 0, scale: 0 },
              { x: Math.cos(ang) * dist * 1.3, y: Math.sin(ang) * dist * 0.75, rotation: (rnd() - 0.5) * 720, scale: 1, duration: 1.2, ease: "power3.out" },
              t + 0.05,
            );
            tl.to(p, { y: `+=${180 + rnd() * 200}`, rotation: `+=${(rnd() - 0.5) * 360}`, duration: 2.6, ease: "power1.in" }, t + 1.25);
          });
          HF.popWords(tl, "#outro-l1", t + 0.1, { stagger: 0.15, d: 0.6 });
          HF.popWords(tl, "#outro-l2", t + 0.8, { stagger: 0.08 });
          HF.pop(tl, "#outro-cred", t + 1.6);
          tl.fromTo("#outro-fade", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.in" }, D - 0.8);
          HF.wipes(tl, D, HF.$("#outro-wipe-in"), null);
          window.__timelines["outro"] = tl;
        })();
