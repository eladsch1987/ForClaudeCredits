<!DOCTYPE html>
<!-- 8. Outro: Your turn  (4 s). Shared styles + helpers live in index.html and assets/motion.js. -->
<html lang="en" data-composition-variables='[{"id":"cta","type":"string","label":"Call to action","default":"Your turn."}]'>
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="outro-template">
      <style>
        #outro {
          position: absolute;
          inset: 0;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 90px 120px;
          background: var(--pink);
          color: #fff;
        }
        /* ---------- scene 8: outro ---------- */
        .confetti {
          position: absolute;
          display: block;
          border-radius: 4px;
        }
        .credits {
          margin-top: 60px;
        }
        #outro-fade {
          position: absolute;
          inset: 0;
          z-index: 70;
          background: var(--ink);
          opacity: 0;
        }
      </style>

      <div data-hf-id="hf-clfl" id="outro" data-composition-id="outro" data-width="1920" data-height="1080" data-duration="4">
        <div data-hf-id="hf-c2jv" class="layer" id="outro-confetti"></div>
        <div data-hf-id="hf-mcm7" class="content">
          <div data-hf-id="hf-36zf" class="mega split" id="outro-l1">Your turn.</div>
          <div data-hf-id="hf-ww9z" class="lead split" id="outro-l2" style="margin-top: 36px">Describe it. Claude builds it.</div>
          <div data-hf-id="hf-8mj0" class="chip small credits" id="outro-cred">Made 100% with code · HyperFrames + GSAP + a homemade synth</div>
        </div>
        <div data-hf-id="hf-dca1" id="outro-fade"></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("outro", 4); // scene length (set in index.html)
          const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          if (vars.cta) HF.$("#outro-l1").textContent = vars.cta;
          const rnd = HF.rng(42);
          HF.splitWords(document.getElementById("outro"));

          const t = 0; // times below are seconds from the start of this scene
          const c = document.getElementById("outro-confetti");
          const cols = ["var(--yellow)", "var(--mint)", "var(--violet)", "var(--cream)", "var(--orange)"];
          for (let k = 0; k < 70; k++) {
            const p = document.createElement("i");
            p.className = "confetti";
            const w = 14 + rnd() * 18;
            p.style.cssText = `left:50%;top:45%;width:${w}px;height:${w * (0.4 + rnd() * 0.8)}px;background:${cols[k % cols.length]};`;
            c.appendChild(p);
            const ang = rnd() * Math.PI * 2;
            const dist = 400 + rnd() * 700;
            tl.fromTo(
              p,
              { x: 0, y: 0, rotation: 0, scale: 0 },
              { x: Math.cos(ang) * dist * 1.3, y: Math.sin(ang) * dist * 0.75, rotation: (rnd() - 0.5) * 720, scale: 1, duration: 1.2, ease: "power3.out" },
              t + 0.05,
            );
            tl.to(p, { y: `+=${180 + rnd() * 200}`, rotation: `+=${(rnd() - 0.5) * 360}`, duration: 2.6, ease: "power1.in" }, t + 1.25);
          }
          HF.popWords(tl, "#outro-l1", t + 0.1, { stagger: 0.15, d: 0.6 });
          HF.popWords(tl, "#outro-l2", t + 0.8, { stagger: 0.08 });
          HF.pop(tl, "#outro-cred", t + 1.6);
          tl.fromTo("#outro-fade", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.in" }, D - 0.8);
          HF.wipes(tl, document.getElementById("outro"), D, ["var(--yellow)", "var(--pink)"], null);
          window.__timelines["outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
