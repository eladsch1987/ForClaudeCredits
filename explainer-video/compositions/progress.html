<!DOCTYPE html>
<!-- Thin progress bar along the bottom edge, for the whole video. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="progress-template">
      <style>
        #progress {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        #progress-track {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 10px;
          background: rgba(0, 0, 0, 0.15);
        }
        #progress-bar {
          display: block;
          width: 100%;
          height: 100%;
          background: var(--yellow);
          transform-origin: left center;
        }
      </style>
      <div data-hf-id="hf-3zap" id="progress" data-composition-id="progress" data-width="1920" data-height="1080" data-duration="60">
        <div data-hf-id="hf-o48q" id="progress-track"><b data-hf-id="hf-bk4b" id="progress-bar"></b></div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("progress", 60);
          tl.fromTo("#progress-bar", { scaleX: 0 }, { scaleX: 1, duration: D, ease: "none" }, 0);
          window.__timelines["progress"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
