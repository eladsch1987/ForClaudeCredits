<!DOCTYPE html>
<!-- 3. Free tools  (8 s). Shared styles + helpers live in index.html and assets/motion.js. -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template id="tools-template">
      <style>
        #tools {
          position: absolute;
          inset: 0;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 90px 120px;
          background: var(--yellow);
          color: var(--ink);
        }
        /* ---------- scene 3: toolkit ---------- */
        .cards {
          display: flex;
          gap: 44px;
          margin-top: 64px;
        }
        .tool {
          width: 480px;
          border-radius: 36px;
          background: var(--cream);
          color: var(--ink);
          padding: 46px 40px 44px;
          text-align: left;
          box-shadow: 0 18px 0 rgba(27, 16, 54, 0.9);
          border: 6px solid var(--ink);
        }
        .tool .badge {
          width: 92px;
          height: 92px;
          border-radius: 26px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 40px;
          color: #fff;
          margin-bottom: 28px;
        }
        .tool h3 {
          font-weight: 900;
          font-size: 54px;
          line-height: 1.05;
          letter-spacing: -0.02em;
        }
        .tool .what {
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 34px;
          margin-top: 14px;
        }
        .tool .note {
          font-weight: 600;
          font-size: 28px;
          margin-top: 18px;
          color: #4a3d63;
        }
        .sticker {
          position: absolute;
          right: 46px;
          bottom: 46px;
          width: 230px;
          height: 230px;
          border-radius: 50%;
          background: var(--pink);
          color: #fff;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          z-index: 3;
          border: 8px solid var(--ink);
        }
        .sticker b {
          display: block;
          font-weight: 900;
          font-size: 92px;
          line-height: 0.95;
          letter-spacing: -0.04em;
        }
        .sticker span {
          display: block;
          font-weight: 800;
          font-size: 30px;
          line-height: 1.1;
        }
      </style>

      <div data-hf-id="hf-k2th" id="tools" data-composition-id="tools" data-width="1920" data-height="1080" data-duration="8">
        <div data-hf-id="hf-y6ad" class="layer" id="tools-shapes">
          <span data-hf-id="hf-rfrg" class="shape s-circle" id="tools-shape-1" data-rot="0" style="left: 94%; top: 14%; width: 120px; height: 120px; margin: -60px 0 0 -60px; font-size: 120px; color: var(--pink)"><i id="tools-shape-1-fill" data-hf-id="hf-wt6k"></i></span>
          <span data-hf-id="hf-h16m" class="shape s-tri" id="tools-shape-2" data-rot="-10" style="left: 6%; top: 86%; width: 130px; height: 130px; margin: -65px 0 0 -65px; font-size: 130px; color: var(--violet)"><i id="tools-shape-2-fill" data-hf-id="hf-zeb8"></i></span>
          <span data-hf-id="hf-qkdl" class="shape s-zig" id="tools-shape-3" data-rot="0" style="left: 62%; top: 93%; width: 150px; height: 150px; margin: -75px 0 0 -75px; font-size: 150px; color: var(--orange)"><i id="tools-shape-3-fill" data-hf-id="hf-y7e5"></i></span>
          <span data-hf-id="hf-n742" class="shape s-ring" id="tools-shape-4" data-rot="0" style="left: 40%; top: 92%; width: 90px; height: 90px; margin: -45px 0 0 -45px; font-size: 90px; color: var(--ink)"><i id="tools-shape-4-fill" data-hf-id="hf-ylp6"></i></span>
        </div>
        <div data-hf-id="hf-ppiy" class="sticker" id="tools-sticker"><b id="tools-0" data-hf-id="hf-hpi1">$0</b><span id="tools-extra-tools" data-hf-id="hf-n6hi">extra tools</span></div>
        <div id="tools-content" data-hf-id="hf-mcm7" class="content">
          <div data-hf-id="hf-w9gp" class="title" id="tools-title"><span data-hf-id="hf-36kl" class="wm"><span data-hf-id="hf-1mpd" class="w" id="tools-title-w1">Free</span></span><span data-hf-id="hf-w1g9" class="wm"><span data-hf-id="hf-g76z" class="w" id="tools-title-w2">tools</span></span><span data-hf-id="hf-x8dc" class="wm"><span data-hf-id="hf-z26g" class="w" id="tools-title-w3">do</span></span><span data-hf-id="hf-wu2b" class="wm"><span data-hf-id="hf-0a6d" class="w" id="tools-title-w4">the</span></span><span data-hf-id="hf-uuj6" class="wm"><span data-hf-id="hf-ov5e" class="w" id="tools-title-w5">heavy</span></span><span data-hf-id="hf-ug85" class="wm"><span data-hf-id="hf-i34f" class="w" id="tools-title-w6">lifting</span></span></div>
          <div id="tools-cards" data-hf-id="hf-5cwd" class="cards">
            <div data-hf-id="hf-ca0w" class="tool" id="tool-1">
              <div id="tools-badge" data-hf-id="hf-k379" class="badge" style="background: var(--violet)">&lt;/&gt;</div>
              <h3 id="tools-hyperframes" data-hf-id="hf-gobw">HyperFrames</h3>
              <div id="tools-html-mp4" data-hf-id="hf-8dau" class="what">HTML → MP4</div>
              <div id="tools-open-source-what" data-hf-id="hf-awlr" class="note">Open source · what this video uses</div>
            </div>
            <div data-hf-id="hf-kxwr" class="tool" id="tool-2">
              <div id="tools-badge-2" data-hf-id="hf-51r3" class="badge" style="background: var(--pink)">{ }</div>
              <h3 id="tools-remotion" data-hf-id="hf-esp3">Remotion</h3>
              <div id="tools-react-mp4" data-hf-id="hf-q9ew" class="what">React → MP4</div>
              <div id="tools-free-for-individuals" data-hf-id="hf-kmf6" class="note">Free for individuals &amp; small teams</div>
            </div>
            <div data-hf-id="hf-gzsq" class="tool" id="tool-3">
              <div id="tools-badge-3" data-hf-id="hf-zxgx" class="badge" style="background: var(--orange); color: var(--ink)">▶</div>
              <h3 id="tools-chrome-ffmpeg" data-hf-id="hf-ptr0">Chrome + FFmpeg</h3>
              <div id="tools-frame-video" data-hf-id="hf-5vxe" class="what">frame → video</div>
              <div id="tools-the-free-engines" data-hf-id="hf-thdc" class="note">The free engines doing the rendering</div>
            </div>
          </div>
        </div>
        <!-- colored wipes into / out of this scene -->
        <div data-hf-id="hf-xk17" class="wipe" data-layout-allow-overflow="" id="tools-wipe-in"><b data-hf-id="hf-5wot" class="p" id="tools-wipe-in-a" style="background: var(--violet)"></b><b data-hf-id="hf-xna5" class="p" id="tools-wipe-in-b" style="background: var(--yellow)"></b></div>
        <div data-hf-id="hf-ui2u" class="wipe" data-layout-allow-overflow="" id="tools-wipe-out"><b data-hf-id="hf-dpx1" class="p" id="tools-wipe-out-a" style="background: var(--pink)"></b><b data-hf-id="hf-9kqq" class="p" id="tools-wipe-out-b" style="background: var(--mint)"></b></div>
      </div>

      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const D = HF.sceneDuration("tools", 8); // scene length (set in index.html)
          HF.splitWords(document.getElementById("tools"));

          const t = 0; // times below are seconds from the start of this scene
          const sh = HF.$$("#tools-shapes .shape"); // the shapes are in the HTML above
          HF.animateShapes(tl, sh, t + 0.2, D);
          HF.popWords(tl, "#tools-title", t + 0.25);
          ["#tool-1", "#tool-2", "#tool-3"].forEach((id, k) => {
            tl.fromTo(id, { y: 500, rotation: (k - 1) * 10 }, { y: 0, rotation: 0, duration: 0.7, ease: "back.out(1.4)" }, t + 1.0 + k * 0.5);
            tl.fromTo(
              id,
              { scale: 1 },
              { scale: 1.03, duration: HF.BEAT / 2, ease: "power1.out", yoyo: true, repeat: 2 * Math.floor((D - 3) / HF.BEAT) - 1 },
              t + 3.0 + (k * HF.BEAT) / 3,
            );
          });
          tl.fromTo("#tools-sticker", { scale: 0, rotation: -200 }, { scale: 1, rotation: 12, duration: 0.8, ease: "back.out(2)" }, t + 3.6);
          HF.wipes(tl, D, HF.$("#tools-wipe-in"), HF.$("#tools-wipe-out"));
          window.__timelines["tools"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
