<!DOCTYPE html>
<!--
  "Make videos with code": a 60 s motion-graphics explainer.

  How this project is laid out (see TWEAKING.md for step-by-step edits):
    • index.html (this file)    → the timeline: which scene plays when, the music,
                                   and the color palette
    • compositions/<scene>.html → one file per scene: its text, layout and animation
    • assets/shared.css         → fonts, text sizes and shapes every scene uses
    • assets/motion.js          → small animation helpers the scenes share
    • music/compose.mjs       → the synthesizer that writes assets/music.mp3

  Open it in HyperFrames Studio with:  npx hyperframes preview
-->
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"violet","type":"color","label":"Violet","default":"#5B2EFF"},
    {"id":"pink","type":"color","label":"Pink","default":"#FF2E7E"},
    {"id":"yellow","type":"color","label":"Yellow","default":"#FFC93C"},
    {"id":"mint","type":"color","label":"Mint","default":"#2EE6C5"},
    {"id":"orange","type":"color","label":"Orange","default":"#FF7A1A"},
    {"id":"ink","type":"color","label":"Ink (dark)","default":"#1B1036"},
    {"id":"cream","type":"color","label":"Cream (light)","default":"#FFF7E8"}
  ]'
>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/motion.js"></script>
    <link rel="stylesheet" href="assets/shared.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #1b1036;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        color: #fff;
        background: var(--ink);
      }

      /* every scene slot fills the frame */
      #root > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      /* the progress bar sits above the scenes */
      #el-progress {
        z-index: 60;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-qbnw" id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <!-- Scenes, in order. Change data-start / data-duration to retime (or drag them in Studio). -->
      <div data-hf-id="hf-nxga" id="el-hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-zze6" id="el-idea" data-composition-id="idea" data-composition-src="compositions/idea.html" data-start="6" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-autn" id="el-tools" data-composition-id="tools" data-composition-src="compositions/tools.html" data-start="14" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-t63s" id="el-how" data-composition-id="how" data-composition-src="compositions/how.html" data-start="22" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-a64z" id="el-music" data-composition-id="music" data-composition-src="compositions/music.html" data-start="32" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-uwp2" id="el-tweak" data-composition-id="tweak" data-composition-src="compositions/tweak.html" data-start="40" data-duration="10" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-vnuo" id="el-skills" data-composition-id="skills" data-composition-src="compositions/skills.html" data-start="50" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-re2p" id="el-outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="56" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Progress bar along the bottom, whole video -->
      <div data-hf-id="hf-yg43" id="el-progress" data-composition-id="progress" data-composition-src="compositions/progress.html" data-start="0" data-duration="60" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music: generated by music/compose.mjs (an original synth track, 120 BPM) -->
      <audio data-hf-id="hf-0ysq" id="bgm" src="assets/music.mp3" data-start="0" data-duration="60" data-volume="1" data-track-index="9"></audio>
    </div>

    <script>
      // All animation lives in the scene files; the root timeline only anchors them.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
